<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Brawl Legends 3D</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101827;color:#fff;font-family:system-ui}#game{position:fixed;inset:0}canvas{display:block;width:100%;height:100%;touch-action:none}#hud{position:fixed;top:env(safe-area-inset-top,10px);left:0;right:0;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;pointer-events:none;text-shadow:0 2px 5px #000;font-weight:900}#brand{font-size:18px;letter-spacing:1px}#stats{background:#101827bb;border:1px solid #ffffff30;border-radius:14px;padding:8px 12px;font-size:14px}#controls{position:fixed;bottom:env(safe-area-inset-bottom,12px);left:0;right:0;padding:18px 22px;display:flex;justify-content:space-between;align-items:end;pointer-events:none}#stick{width:124px;height:124px;border-radius:50%;background:#dbeafe33;border:2px solid #ffffff55;position:relative;touch-action:none;pointer-events:auto;backdrop-filter:blur(5px)}#nub{position:absolute;width:54px;height:54px;border-radius:50%;background:#e2e8f0bb;left:33px;top:33px;box-shadow:0 4px 15px #0008}#hit{width:94px;height:94px;border-radius:50%;border:3px solid #fff8;background:linear-gradient(#ff745e,#c62828);color:white;font-size:16px;font-weight:1000;box-shadow:0 7px 0 #761d1d,0 8px 20px #0008;pointer-events:auto;touch-action:none}#overlay{position:fixed;inset:0;display:grid;place-items:center;background:linear-gradient(#07101a99,#07101add);padding:22px;text-align:center}#panel{width:min(420px,92vw);padding:28px 22px;border:1px solid #ffffff35;border-radius:24px;background:#111d2beF;box-shadow:0 20px 80px #0009}h1{font-size:clamp(30px,8vw,48px);margin:0 0 10px;color:#ffd34d;text-shadow:0 4px #8d4a19}p{color:#dbeafe;line-height:1.5}button.start{border:0;border-radius:14px;padding:15px 26px;background:linear-gradient(#ffe36b,#f2a900);color:#372000;font-size:17px;font-weight:1000;box-shadow:0 5px 0 #9b6500}#hint{position:fixed;bottom:150px;left:0;right:0;text-align:center;color:#fff9;font-size:12px;pointer-events:none}@media(min-width:800px){#controls{max-width:900px;margin:auto}#hint{bottom:18px}}
</style></head><body>
<div id="game"></div><div id="hud"><div id="brand">⚔ BRAWL LEGENDS</div><div id="stats">❤️ 100　⭐ 0　03:00</div></div>
<div id="hint">Двигайся джойстиком · УДАР — атаковать</div>
<div id="controls"><div id="stick"><div id="nub"></div></div><button id="hit">УДАР</button></div>
<div id="overlay"><div id="panel"><h1>BRAWL LEGENDS</h1><p>3D-арена. Победи ботов и продержись до конца!</p><button class="start" id="start">НАЧАТЬ БОЙ</button><p style="font-size:12px;color:#94a3b8">На компьютере: WASD / стрелки + пробел</p></div></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
const root=document.querySelector('#game'),stats=document.querySelector('#stats'),overlay=document.querySelector('#overlay');
const scene=new THREE.Scene();scene.background=new THREE.Color(0x8bc8d5);scene.fog=new THREE.Fog(0x8bc8d5,22,48);
const camera=new THREE.PerspectiveCamera(48,innerWidth/innerHeight,.1,100);camera.position.set(0,17,19);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;root.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xdff7ff,0x506047,2));
const sun=new THREE.DirectionalLight(0xfff1d0,3);sun.position.set(-8,16,10);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);sun.shadow.camera.left=-18;sun.shadow.camera.right=18;sun.shadow.camera.top=18;sun.shadow.camera.bottom=-18;scene.add(sun);
const mat=(color,roughness=.8)=>new THREE.MeshStandardMaterial({color,roughness});
const floor=new THREE.Mesh(new THREE.CylinderGeometry(17,17,.7,64),mat(0x5b9b55));floor.position.y=-.45;floor.receiveShadow=true;scene.add(floor);
const top=new THREE.Mesh(new THREE.CircleGeometry(16.7,64),mat(0x82bd65));top.rotation.x=-Math.PI/2;top.position.y=-.08;top.receiveShadow=true;scene.add(top);
const grid=new THREE.GridHelper(32,32,0x477e4b,0x75a85c);grid.position.y=-.065;scene.add(grid);
const ring=new THREE.Mesh(new THREE.TorusGeometry(16.8,.22,8,100),mat(0xe5c46a));ring.rotation.x=Math.PI/2;ring.position.y=.02;scene.add(ring);
function box(x,z,sx,sz,color){const m=new THREE.Mesh(new THREE.BoxGeometry(sx,1.2,sz),mat(color));m.position.set(x,.5,z);m.castShadow=true;m.receiveShadow=true;scene.add(m);return m}
for(const [x,z,sx,sz] of [[-7,-5,2,2],[7,-6,2,2],[-8,6,2,2],[7,6,2,2],[0,-10,3,1],[0,10,3,1]]){box(x,z,sx,sz,0x9a7045);const cap=new THREE.Mesh(new THREE.BoxGeometry(sx+.15,.18,sz+.15),mat(0xd7b477));cap.position.set(x,1.12,z);scene.add(cap)}
for(let i=0;i<18;i++){const a=i*2.4,r=10+(i%3)*1.5;const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.12,.18,.9,7),mat(0x76502f));trunk.position.set(Math.cos(a)*r,.35,Math.sin(a)*r);trunk.castShadow=true;scene.add(trunk);const crown=new THREE.Mesh(new THREE.IcosahedronGeometry(.65,1),mat(0x287d49));crown.position.set(Math.cos(a)*r,1.15,Math.sin(a)*r);crown.castShadow=true;scene.add(crown)}
function fighter(color,accent){const g=new THREE.Group();const body=new THREE.Mesh(new THREE.CapsuleGeometry(.48,.55,5,10),mat(color));body.position.y=1.05;body.castShadow=true;g.add(body);const head=new THREE.Mesh(new THREE.SphereGeometry(.43,16,12),mat(0xffd5a4));head.position.y=1.95;head.castShadow=true;g.add(head);const helmet=new THREE.Mesh(new THREE.SphereGeometry(.48,16,8,0,Math.PI*2,0,Math.PI*.55),mat(accent));helmet.position.y=2.08;helmet.castShadow=true;g.add(helmet);for(const s of [-1,1]){const eye=new THREE.Mesh(new THREE.SphereGeometry(.055,8,8),mat(0x172033));eye.position.set(s*.15,1.98,.37);g.add(eye);const arm=new THREE.Mesh(new THREE.CapsuleGeometry(.16,.48,4,8),mat(color));arm.position.set(s*.57,1.05,0);arm.rotation.z=s*.25;arm.castShadow=true;g.add(arm);const boot=new THREE.Mesh(new THREE.BoxGeometry(.3,.35,.48),mat(0x263348));boot.position.set(s*.25,.25,.08);g.add(boot)}const shadow=new THREE.Mesh(new THREE.CircleGeometry(.68,20),new THREE.MeshBasicMaterial({color:0x15251a,transparent:true,opacity:.22}));shadow.rotation.x=-Math.PI/2;shadow.position.y=.015;g.add(shadow);scene.add(g);return g}
let player,bots=[],hp=100,score=0,time=180,running=false,last=0,attackCd=0,attack=false,keys={},joy={x:0,y:0},effects=[];
function spawnBot(i){const a=i*Math.PI*2/6;const g=fighter(0xd94b43,0x7f1d2d);g.position.set(Math.cos(a)*11,0,Math.sin(a)*11);return {g,hp:2,cd:0}}
function reset(){if(player)scene.remove(player);bots.forEach(b=>scene.remove(b.g));player=fighter(0x2389e8,0x124eaa);player.position.set(0,0,0);bots=Array.from({length:6},(_,i)=>spawnBot(i));hp=100;score=0;time=180;attackCd=0;running=true;last=performance.now();overlay.style.display='none';requestAnimationFrame(loop)}
function hit(){if(!running||attackCd>0)return;attackCd=.42;const ring=new THREE.Mesh(new THREE.TorusGeometry(1.65,.09,8,32),new THREE.MeshBasicMaterial({color:0xffe27a,transparent:true,opacity:.9}));ring.rotation.x=Math.PI/2;ring.position.copy(player.position);ring.position.y=.16;scene.add(ring);effects.push({m:ring,t:.22});for(const b of bots){if(b.g.position.distanceTo(player.position)<2.65){b.hp--;b.g.position.add(b.g.position.clone().sub(player.position).normalize().multiplyScalar(1.0));if(b.hp<=0){scene.remove(b.g);b.dead=true;score+=10}}}}
function end(){running=false;overlay.style.display='grid';document.querySelector('#panel').innerHTML='<h1>БОЙ ОКОНЧЕН</h1><p>Твой счёт: <b>'+score+'</b></p><button class="start" id="again">ЕЩЁ РАЗ</button>';document.querySelector('#again').onclick=reset}
function loop(now){if(!running)return;const dt=Math.min((now-last)/1000,.04);last=now;time-=dt;attackCd=Math.max(0,attackCd-dt);if(time<=0||hp<=0){end();return}
let dx=(keys.d||keys.ArrowRight?1:0)-(keys.a||keys.ArrowLeft?1:0)+joy.x, dz=(keys.s||keys.ArrowDown?1:0)-(keys.w||keys.ArrowUp?1:0)+joy.y;const len=Math.hypot(dx,dz)||1;if(Math.hypot(dx,dz)>.08){player.position.x+=dx/len*7*dt;player.position.z+=dz/len*7*dt;player.rotation.y=Math.atan2(dx,dz)}player.position.x=THREE.MathUtils.clamp(player.position.x,-15,15);player.position.z=THREE.MathUtils.clamp(player.position.z,-15,15);if(keys[' ']||attack)hit();
for(const b of bots){if(b.dead)continue;const v=player.position.clone().sub(b.g.position);const d=v.length();if(d>1.55){v.normalize();b.g.position.add(v.multiplyScalar(2.25*dt));b.g.rotation.y=Math.atan2(v.x,v.z)}else{hp-=13*dt}}
bots=bots.filter(b=>!b.dead);if(!bots.length)bots=Array.from({length:6},(_,i)=>spawnBot(i));
for(const e of effects){e.t-=dt;e.m.scale.setScalar(1+(1-e.t/.22)*.65);e.m.material.opacity=Math.max(0,e.t/.22);if(e.t<=0)scene.remove(e.m)}effects=effects.filter(e=>e.t>0);
const target=player.position;camera.position.lerp(new THREE.Vector3(target.x,17,target.z+19),.08);camera.lookAt(target.x,0,target.z);stats.textContent='❤️ '+Math.max(0,Math.ceil(hp))+'　⭐ '+score+'　'+String(Math.floor(time/60)).padStart(2,'0')+':'+String(Math.floor(time%60)).padStart(2,'0');renderer.render(scene,camera);requestAnimationFrame(loop)}
document.querySelector('#start').onclick=reset;addEventListener('keydown',e=>{keys[e.key]=true;if(e.key===' ')e.preventDefault()});addEventListener('keyup',e=>keys[e.key]=false);addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
const stick=document.querySelector('#stick'),nub=document.querySelector('#nub');function move(e){const r=stick.getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2),l=Math.hypot(dx,dy),m=Math.min(39,l),a=Math.atan2(dy,dx);joy={x:Math.cos(a)*m/39,y:Math.sin(a)*m/39};nub.style.left=(33+joy.x*34)+'px';nub.style.top=(33+joy.y*34)+'px'}stick.onpointerdown=e=>{stick.setPointerCapture(e.pointerId);move(e)};stick.onpointermove=e=>{if(e.buttons)move(e)};stick.onpointerup=stick.onpointercancel=()=>{joy={x:0,y:0};nub.style.left='33px';nub.style.top='33px'};const hitBtn=document.querySelector('#hit');hitBtn.onpointerdown=e=>{attack=true;hitBtn.setPointerCapture(e.pointerId)};hitBtn.onpointerup=hitBtn.onpointercancel=()=>attack=false;
renderer.setAnimationLoop(()=>{if(!running)renderer.render(scene,camera)});
</script></body></html>
