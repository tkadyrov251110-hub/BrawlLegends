<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Brawl Legends 3D</title>
<style>

</style></head><body>
<div id="game"></div><div id="hud"><div id="brand">⚔ BRAWL LEGENDS</div><div id="stats">❤️ 100　⭐ 0　03:00</div></div><div id="hint">Джойстик — движение · УДАР — атака · ПОЛЁТ — взлететь / сесть</div>
<div id="controls"><div id="stick"><div id="nub"></div></div><div class="actions"><button id="fly">✈<br>ПОЛЁТ</button><button id="hit">УДАР</button></div></div>
<div id="overlay"><div id="panel"><h1>BRAWL LEGENDS</h1><p>Выбери бойца и отправляйся исследовать огромный остров!</p><div class="roster" id="roster"></div><p id="bio" class="small"></p><button class="start" id="start">НАЧАТЬ БОЙ</button><p class="small">WASD / стрелки — движение · Пробел — атака · F — полёт</p></div></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
const root=document.querySelector('#game'),stats=document.querySelector('#stats'),overlay=document.querySelector('#overlay');
const scene=new THREE.Scene();scene.background=new THREE.Color(0x83c8df);scene.fog=new THREE.Fog(0x83c8df,75,175);
const camera=new THREE.PerspectiveCamera(54,innerWidth/innerHeight,.1,260);camera.position.set(0,25,32);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.8));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.12;root.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xe7f8ff,0x52634c,2.0));const sun=new THREE.DirectionalLight(0xfff0ce,3.1);sun.position.set(-35,65,28);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);sun.shadow.camera.left=-85;sun.shadow.camera.right=85;sun.shadow.camera.top=85;sun.shadow.camera.bottom=-85;scene.add(sun);
const mat=(c,r=.78,m=0)=>new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:m});
const ground=new THREE.Mesh(new THREE.PlaneGeometry(220,220),mat(0x73ae5e));ground.rotation.x=-Math.PI/2;ground.position.y=-.55;ground.receiveShadow=true;scene.add(ground);
const island=new THREE.Mesh(new THREE.CylinderGeometry(104,108,3,96),mat(0x568b4d));island.position.y=-2;island.receiveShadow=true;scene.add(island);
const water=new THREE.Mesh(new THREE.PlaneGeometry(500,500),new THREE.MeshStandardMaterial({color:0x278eae,roughness:.3,metalness:.15}));water.rotation.x=-Math.PI/2;water.position.y=-3.7;scene.add(water);
const ring=new THREE.Mesh(new THREE.TorusGeometry(104,.8,10,180),mat(0xf0d17b));ring.rotation.x=Math.PI/2;ring.position.y=-.35;scene.add(ring);
const colors=[{name:'ВИХРЬ',color:0x2389e8,accent:0x123f9b,speed:11,hp:110,desc:'Быстрый боец · высокая скорость'},{name:'ТИТАН',color:0x9a62d8,accent:0x4d247e,speed:8,hp:170,desc:'Тяжёлый боец · много здоровья'},{name:'ИСКРА',color:0xe84c48,accent:0x8e2020,speed:10,hp:100,desc:'Сбалансированный боец · быстрые атаки'},{name:'ЛИСТОК',color:0x42b96b,accent:0x176b3b,speed:9.5,hp:125,desc:'Универсал · уверенный полёт'}];let selected=0;
const roster=document.querySelector('#roster');function renderRoster(){roster.innerHTML='';colors.forEach((c,i)=>{const b=document.createElement('button');b.className='fighterPick'+(i===selected?' selected':'');b.innerHTML='<div class="portrait" style="background:linear-gradient('+new THREE.Color(c.color).getStyle()+',#f6c89e)"></div>'+c.name;b.onclick=()=>{selected=i;renderRoster();document.querySelector('#bio').textContent=c.desc};roster.appendChild(b)});document.querySelector('#bio').textContent=colors[selected].desc}renderRoster();
function makeFighter(color,accent){const g=new THREE.Group();const skin=mat(0xffc995),cloth=mat(color,.55),trim=mat(accent,.42,.12),dark=mat(0x202b3c);const torso=new THREE.Mesh(new THREE.CapsuleGeometry(.56,.72,7,14),cloth);torso.position.y=1.35;torso.castShadow=true;g.add(torso);const head=new THREE.Mesh(new THREE.SphereGeometry(.43,24,18),skin);head.position.y=2.38;head.castShadow=true;g.add(head);const hair=new THREE.Mesh(new THREE.SphereGeometry(.46,24,12,0,Math.PI*2,0,Math.PI*.55),trim);hair.position.y=2.52;hair.castShadow=true;g.add(hair);const eyes=[];for(const s of [-1,1]){const eye=new THREE.Mesh(new THREE.SphereGeometry(.065,12,10),dark);eye.position.set(s*.16,2.4,.38);g.add(eye);eyes.push(eye)}const arms=[],legs=[];for(const s of [-1,1]){const arm=new THREE.Group();arm.position.set(s*.57,1.7,0);const upper=new THREE.Mesh(new THREE.CapsuleGeometry(.17,.48,5,10),cloth);upper.position.y=-.28;upper.rotation.z=s*.12;upper.castShadow=true;arm.add(upper);const glove=new THREE.Mesh(new THREE.SphereGeometry(.2,14,12),trim);glove.position.set(s*.03,-.61,.05);arm.add(glove);g.add(arm);arms.push(arm);const leg=new THREE.Group();leg.position.set(s*.25,.75,0);const boot=new THREE.Mesh(new THREE.CapsuleGeometry(.19,.52,5,10),dark);boot.position.y=-.28;boot.castShadow=true;leg.add(boot);g.add(leg);legs.push(leg)}const belt=new THREE.Mesh(new THREE.TorusGeometry(.43,.08,8,24),trim);belt.rotation.x=Math.PI/2;belt.position.y=1.02;g.add(belt);const shadow=new THREE.Mesh(new THREE.CircleGeometry(.72,24),new THREE.MeshBasicMaterial({color:0x14241b,transparent:true,opacity:.25}));shadow.rotation.x=-Math.PI/2;shadow.position.y=.025;g.add(shadow);const aura=new THREE.Mesh(new THREE.TorusGeometry(.8,.035,8,40),new THREE.MeshBasicMaterial({color:color,transparent:true,opacity:.55}));aura.rotation.x=Math.PI/2;aura.position.y=.06;g.add(aura);scene.add(g);return {g,arms,legs,torso,head,aura,baseY:0,phase:Math.random()*6}}
function defeatCutscene(){
 const g=new THREE.Group(),skin=mat(0xffd0b4),hair=mat(0x34234d),outfit=mat(0x8749c9),gold=mat(0xffd36a);
 const add=(geo,ma,parent,x,y,z)=>{const m=new THREE.Mesh(geo,ma);m.position.set(x,y,z);m.castShadow=true;parent.add(m);return m};
 const torso=new THREE.Group();g.add(torso);
 add(new THREE.CapsuleGeometry(.36,.72,8,18),outfit,torso,0,1.65,0);
 add(new THREE.SphereGeometry(.38,24,20),skin,torso,0,2.55,0);
 add(new THREE.SphereGeometry(.4,24,16,0,Math.PI*2,0,Math.PI*.55),hair,torso,0,2.68,-.02);
 add(new THREE.CapsuleGeometry(.15,.85,6,12),hair,torso,0,2.05,-.38).rotation.x=-.3;
 const arms=[],legs=[];
 for(const s of [-1,1]){const a=new THREE.Group();a.position.set(s*.43,2.05,0);torso.add(a);add(new THREE.CapsuleGeometry(.13,.55,6,12),outfit,a,0,-.3,0);add(new THREE.SphereGeometry(.14,12,10),skin,a,0,-.62,.03);arms.push(a);
 const l=new THREE.Group();l.position.set(s*.2,.9,0);g.add(l);add(new THREE.CapsuleGeometry(.16,.6,6,12),skin,l,0,-.3,0);add(new THREE.CapsuleGeometry(.15,.48,6,12),outfit,l,0,-.82,.02);legs.push(l)}
 add(new THREE.SphereGeometry(.43,20,14),outfit,g,0,1.05,0);
 const cape=add(new THREE.ConeGeometry(.55,1.4,16),hair,g,0,1.55,-.5);cape.rotation.x=-.2;
 const halo=add(new THREE.TorusGeometry(.65,.035,8,36),gold,g,0,3.15,0);halo.rotation.x=Math.PI/2;
 scene.add(g);g.position.set(player.g.position.x,0,player.g.position.z-2);
 const start=performance.now();function frame(now){const t=(now-start)/1000;if(t>6){scene.remove(g);overlay.style.display='grid';document.querySelector('#panel').innerHTML='<h1>ПОРАЖЕНИЕ</h1><p>Твой счёт: <b>'+score+'</b></p><button class="start" id="again">ЕЩЁ РАЗ</button>';document.querySelector('#again').onclick=()=>location.reload();return}
 torso.rotation.z=Math.sin(now*.002)*.035;torso.rotation.y=Math.sin(now*.001)*.12;arms[0].rotation.z=Math.sin(now*.0025)*.18;arms[1].rotation.z=-Math.sin(now*.0025)*.18;legs[0].rotation.x=Math.sin(now*.0018)*.07;legs[1].rotation.x=-Math.sin(now*.0018)*.07;cape.rotation.z=Math.sin(now*.002)*.12;halo.rotation.z=now*.0007;g.position.y=.5+Math.min(t*.35,.8)+Math.sin(now*.002)*.035;
 camera.position.lerp(new THREE.Vector3(g.position.x+4,5,g.position.z+9),.04);camera.lookAt(g.position.x,2,g.position.z);renderer.render(scene,camera);requestAnimationFrame(frame)}requestAnimationFrame(frame)
}
function tree(x,z,s=1){const t=new THREE.Group();const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.22*s,.34*s,1.8*s,9),mat(0x76502f));trunk.position.y=.7*s;trunk.castShadow=true;t.add(trunk);for(let j=0;j<3;j++){const crown=new THREE.Mesh(new THREE.IcosahedronGeometry((1.05-j*.13)*s,1),mat([0x287d49,0x358c4e,0x4c9b50][j]));crown.position.set((j-1)*.35*s,(1.8+j*.55)*s,0);crown.castShadow=true;t.add(crown)}t.position.set(x,0,z);scene.add(t)}
function obstacle(x,z,sx,sz){const g=new THREE.Group();const b=new THREE.Mesh(new THREE.BoxGeometry(sx,1.6,sz),mat(0x966b42));b.position.y=.8;b.castShadow=true;b.receiveShadow=true;g.add(b);const top=new THREE.Mesh(new THREE.BoxGeometry(sx+.15,.2,sz+.15),mat(0xd6b477));top.position.y=1.65;g.add(top);g.position.set(x,0,z);scene.add(g)}
for(let i=0;i<110;i++){const a=i*2.399,r=24+(i%11)*7.1;tree(Math.cos(a)*r,Math.sin(a)*r,.7+(i%4)*.16)}
for(let i=0;i<30;i++){const a=i*2.4,r=10+(i%5)*13;obstacle(Math.cos(a)*r,Math.sin(a)*r,1.5+(i%3),1.3+(i%2))}
for(let i=0;i<14;i++){const x=(i%7-3)*19,z=(Math.floor(i/7)-.5)*70;const rock=new THREE.Mesh(new THREE.DodecahedronGeometry(1.4+(i%3)*.4,1),mat(0x87949a));rock.position.set(x,.2,z);rock.castShadow=true;scene.add(rock)}
// scenic floating islands and clouds
for(let i=0;i<18;i++){const cloud=new THREE.Group();for(let j=0;j<5;j++){const p=new THREE.Mesh(new THREE.SphereGeometry(2.1+(j%2),16,12),new THREE.MeshStandardMaterial({color:0xffffff,transparent:true,opacity:.72,roughness:1}));p.position.set((j-2)*1.7,Math.sin(j)*.45,Math.cos(j*2)*.7);cloud.add(p)}cloud.position.set(Math.sin(i*8)*115,28+(i%4)*8,Math.cos(i*5)*115);scene.add(cloud)}
let player=null,bots=[],hp=100,score=0,time=180,running=false,last=0,attackCd=0,attack=false,keys={},joy={x:0,y:0},effects=[],flying=false,flyY=0,flyToggle=false;
const clampWorld=99;
function spawnBot(i){const a=i*2.4;const f=makeFighter(0xd94b43,0x7f1d2d);f.g.position.set(Math.cos(a)*18,0,Math.sin(a)*18);return {f,hp:3,cd:0,dead:false,phase:i}}
function reset(){if(player)scene.remove(player.g);bots.forEach(b=>scene.remove(b.f.g));player=makeFighter(colors[selected].color,colors[selected].accent);player.g.position.set(0,0,0);bots=Array.from({length:9},(_,i)=>spawnBot(i));hp=colors[selected].hp;score=0;time=180;attackCd=0;flying=false;flyY=0;running=true;last=performance.now();overlay.style.display='none';requestAnimationFrame(loop)}
function burst(pos,color,count=14){for(let i=0;i<count;i++){const m=new THREE.Mesh(new THREE.SphereGeometry(.09+Math.random()*.09,8,8),new THREE.MeshBasicMaterial({color,transparent:true}));m.position.copy(pos);scene.add(m);const v=new THREE.Vector3((Math.random()-.5)*9,Math.random()*7,(Math.random()-.5)*9);effects.push({m,v,t:.65+Math.random()*.35,life:.9})}}
function slash(){if(!running||attackCd>0)return;attackCd=.48;player.arms[0].rotation.x=-1.8;player.arms[1].rotation.x=-1.8;const p=player.g.position.clone();p.y=1.35;const blade=new THREE.Mesh(new THREE.TorusGeometry(1.75,.12,10,42,Math.PI*1.35),new THREE.MeshBasicMaterial({color:0xfff09a,transparent:true,opacity:1}));blade.rotation.set(Math.PI/2,0,player.g.rotation.y-.7);blade.position.copy(p);scene.add(blade);effects.push({m:blade,t:.3,life:.3,spin:1});burst(p,0xffd76a,8);for(const b of bots){if(b.dead)continue;if(b.f.g.position.distanceTo(player.g.position)<3.2){b.hp--;const dir=b.f.g.position.clone().sub(player.g.position).normalize();b.f.g.position.add(dir.multiplyScalar(2.1));burst(b.f.g.position.clone().add(new THREE.Vector3(0,1,0)),0xff735f,7);b.f.torso.material.emissive.setHex(0x772222);setTimeout(()=>{if(b.f.torso)b.f.torso.material.emissive.setHex(0x000000)},110);if(b.hp<=0){b.dead=true;score+=15;burst(b.f.g.position.clone().add(new THREE.Vector3(0,1,0)),0xffd15b,24);scene.remove(b.f.g)}}}}
function toggleFlight(){if(!running)return;flying=!flying;document.querySelector('#fly').innerHTML=flying?'⬇<br>СЕСТЬ':'✈<br>ПОЛЁТ';if(flying)burst(player.g.position.clone().add(new THREE.Vector3(0,1,0)),0x75e5ff,12)}
function end(){running=false;if(hp<=0){defeatCutscene();return}overlay.style.display='grid';document.querySelector('#panel').innerHTML='<h1>БОЙ ОКОНЧЕН</h1><p>Твой счёт: <b>'+score+'</b></p><button class="start" id="again">ЕЩЁ РАЗ</button>';document.querySelector('#again').onclick=()=>{document.querySelector('#panel').innerHTML='<h1>BRAWL LEGENDS</h1><p>Выбери бойца и отправляйся исследовать огромный остров!</p><div class="roster" id="roster"></div><p id="bio" class="small"></p><button class="start" id="start">НАЧАТЬ БОЙ</button>';renderRoster();document.querySelector('#start').onclick=reset}}
function loop(now){if(!running)return;const dt=Math.min((now-last)/1000,.04);last=now;time-=dt;attackCd=Math.max(0,attackCd-dt);if(attackCd===0){player.arms.forEach(a=>{a.rotation.x=THREE.MathUtils.lerp(a.rotation.x,0,.24)})}if(time<=0||hp<=0){end();return}
let dx=(keys.d||keys.ArrowRight?1:0)-(keys.a||keys.ArrowLeft?1:0)+joy.x,dz=(keys.s||keys.ArrowDown?1:0)-(keys.w||keys.ArrowUp?1:0)+joy.y;const moving=Math.hypot(dx,dz)>.08,len=Math.hypot(dx,dz)||1;player.phase+=dt*(moving?13:3);const speed=colors[selected].speed*(flying?1.5:1);if(moving){player.g.position.x+=dx/len*speed*dt;player.g.position.z+=dz/len*speed*dt;player.g.rotation.y=Math.atan2(dx,dz);player.legs[0].rotation.x=Math.sin(player.phase)*.65;player.legs[1].rotation.x=-Math.sin(player.phase)*.65;player.arms[0].rotation.x=-Math.sin(player.phase)*.35;player.arms[1].rotation.x=Math.sin(player.phase)*.35}else{player.legs.forEach(l=>l.rotation.x=THREE.MathUtils.lerp(l.rotation.x,0,.18));player.g.position.y=flyY+Math.sin(now*.002)*.035}
if(keys[' ']||attack)slash();if(keys.f&&!flyToggle){toggleFlight();flyToggle=true}if(!keys.f)flyToggle=false;
if(flying){flyY=THREE.MathUtils.lerp(flyY,5.5,.045);player.g.position.y=flyY+Math.sin(now*.004)*.28;player.g.rotation.z=THREE.MathUtils.lerp(player.g.rotation.z,-dz*.12,.1)}else{flyY=THREE.MathUtils.lerp(flyY,0,.1);player.g.position.y=flyY}
player.g.position.x=THREE.MathUtils.clamp(player.g.position.x,-clampWorld,clampWorld);player.g.position.z=THREE.MathUtils.clamp(player.g.position.z,-clampWorld,clampWorld);
for(const b of bots){if(b.dead)continue;const v=player.g.position.clone().sub(b.f.g.position);const d=v.length();if(d>2.2){v.normalize();b.f.g.position.add(v.multiplyScalar(3.0*dt));b.f.g.rotation.y=Math.atan2(v.x,v.z);b.f.phase+=dt*10;b.f.legs[0].rotation.x=Math.sin(b.f.phase)*.45;b.f.legs[1].rotation.x=-Math.sin(b.f.phase)*.45;b.f.g.position.y=Math.sin(now*.006+b.phase)*.035}else if(!flying){hp-=colors[selected].name==='ТИТАН'?8*dt:12*dt;b.f.arms.forEach(a=>a.rotation.x=Math.sin(now*.015)*.2)}}
bots=bots.filter(b=>!b.dead);if(!bots.length)bots=Array.from({length:9},(_,i)=>spawnBot(i));
for(const e of effects){e.t-=dt;if(e.v){e.m.position.add(e.v.clone().multiplyScalar(dt));e.v.y-=13*dt;e.m.scale.multiplyScalar(.985)}else{e.m.scale.multiplyScalar(1+dt*3);if(e.spin)e.m.rotation.z+=dt*5}e.m.material.opacity=Math.max(0,e.t/e.life)}const expired=effects.filter(e=>e.t<=0);expired.forEach(e=>scene.remove(e.m));effects=effects.filter(e=>e.t>0);
const target=player.g.position;const desired=new THREE.Vector3(target.x, flying?target.y+23:target.y+25,target.z+31);camera.position.lerp(desired,.075);camera.lookAt(target.x,target.y+.7,target.z);
stats.textContent='❤️ '+Math.max(0,Math.ceil(hp))+'　⭐ '+score+'　'+String(Math.floor(time/60)).padStart(2,'0')+':'+String(Math.floor(time%60)).padStart(2,'0')+(flying?'　✈':'');renderer.render(scene,camera);requestAnimationFrame(loop)}
document.querySelector('#start').onclick=reset;document.querySelector('#fly').onclick=toggleFlight;addEventListener('keydown',e=>{keys[e.key]=true;if(e.key===' ')e.preventDefault()});addEventListener('keyup',e=>keys[e.key]=false);addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
const stick=document.querySelector('#stick'),nub=document.querySelector('#nub');function move(e){const r=stick.getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2),l=Math.hypot(dx,dy),m=Math.min(39,l),a=Math.atan2(dy,dx);joy={x:Math.cos(a)*m/39,y:Math.sin(a)*m/39};nub.style.left=(31+joy.x*33)+'px';nub.style.top=(31+joy.y*33)+'px'}stick.onpointerdown=e=>{stick.setPointerCapture(e.pointerId);move(e)};stick.onpointermove=e=>{if(e.buttons)move(e)};stick.onpointerup=stick.onpointercancel=()=>{joy={x:0,y:0};nub.style.left='31px';nub.style.top='31px'};const hitBtn=document.querySelector('#hit');hitBtn.onpointerdown=e=>{attack=true;slash();hitBtn.setPointerCapture(e.pointerId)};hitBtn.onpointerup=hitBtn.onpointercancel=()=>attack=false;
renderer.setAnimationLoop(()=>{if(!running)renderer.render(scene,camera)});
</script></body></html>
