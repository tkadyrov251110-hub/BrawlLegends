services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: nakama
      POSTGRES_USER: nakama
      POSTGRES_PASSWORD: change_me_before_use
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  nakama:
    image: heroiclabs/nakama:3.22.0
    depends_on:
      - postgres
    entrypoint:
      - "/bin/sh"
      - "-ec"
      - >
        /nakama/nakama migrate up
        --database.address postgres:change_me_before_use@postgres:5432/nakama
        &&
        exec /nakama/nakama
        --name brawl-legends
        --database.address postgres:change_me_before_use@postgres:5432/nakama
        --logger.level INFO
        --session.token_expiry_sec 7200
        --runtime.path /nakama/data/modules
    ports:
      - "7349:7349"
      - "7350:7350"
      - "7351:7351"
    volumes:
      - ./data:/nakama/data
    restart: unless-stopped

volumes:
  postgres_data:
